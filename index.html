        body {

            color: #f4f4f5;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;

        /* Heartbeat pulse animation synced to BPM duration */
        @keyframes pulseBeat {
            0% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.35);
            }
            30% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.2);
            }
            60% {
                transform: scale(1);
            }
            100% {
                transform: scale(1);
            }
        }

        .heart-beat {
            display: inline-block;
            transform-origin: center;
            animation: pulseBeat var(--beat-duration, 0.8s) infinite ease-in-out;
        }

        .heart-idle {
            display: inline-block;
            opacity: 0.5;
            transform: scale(1);
        }

        /* Subtle grid background pattern */

            background-image: radial-gradient(#27272a 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Custom dark scrollbar */

            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #09090b;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
    </style>

    <!-- Pulsoid WebSocket Telemetry & Seamless Heartbeat Loop -->
    <script>
        const ACCESS_TOKEN = '10fb1d5c-544b-4b86-a50a-6e2138f0697d';

        let bpm = 0;
        let nextBeat = 0;

        const heartEmoji = document.getElementById('heartEmoji');
        const bpmDisplay = document.getElementById('bpmDisplay');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const liveNotice = document.getElementById('liveNotice');

        // Preload sounds
        const sounds = {
            HB11: new Audio("HB11.wav"),
            HB21: new Audio("HB21.wav"),
            HB31: new Audio("HB31.wav"),
            HB41: new Audio("HB41.wav")
        };

        for (let s in sounds) {
            sounds[s].preload = "auto";
        }

        function playSound(name) {
            sounds[name].currentTime = 0;
            sounds[name].play().catch(() => {});
        }

        // Seamless heartbeat loop driven by requestAnimationFrame
        function heartbeatLoop() {
            let now = performance.now();

            if (bpm > 0 && now >= nextBeat) {
                let sound = "HB11";

                if (bpm > 70) sound = "HB21";
                if (bpm > 100) sound = "HB31";
                if (bpm > 120) sound = "HB41";

                playSound(sound);

                nextBeat = now + (60000 / bpm);
            }

            requestAnimationFrame(heartbeatLoop);
        }

        // Connect directly to Pulsoid Real-time WebSocket
        function connectPulsoid() {
            const socket = new WebSocket(`wss://dev.pulsoid.net/api/v1/data/real_time?access_token=${ACCESS_TOKEN}`);

            socket.onopen = () => {
                statusIndicator.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]';
                statusText.innerText = 'Live';
                statusText.className = 'text-xs font-mono font-medium text-emerald-400 uppercase tracking-wider';
                
                liveNotice.classList.add('hidden');
            };

            socket.onmessage = (e) => {
                try {
                    let data = JSON.parse(e.data);
                    if (!data || !data.data || !data.data.heart_rate) return;

                    bpm = data.data.heart_rate;

                    if (bpm > 0) {
                        bpmDisplay.innerText = bpm;

                        // Sync visual CSS animation to current beat speed
                        const beatDurationSec = (60 / bpm).toFixed(3);
                        document.documentElement.style.setProperty('--beat-duration', `${beatDurationSec}s`);

                        if (!heartEmoji.classList.contains('heart-beat')) {
                            heartEmoji.classList.remove('heart-idle');
                            heartEmoji.classList.add('heart-beat');
                        }
                    }
                } catch (err) {
                    console.error('Error parsing WebSocket payload:', err);
                }
            };

            socket.onerror = () => {
                statusIndicator.className = 'w-2.5 h-2.5 rounded-full bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.6)]';
                statusText.innerText = 'Error';
                statusText.className = 'text-xs font-mono font-medium text-rose-400 uppercase tracking-wider';
                liveNotice.innerText = 'Connection error';
                liveNotice.classList.remove('hidden');
            };

            socket.onclose = () => {
                statusIndicator.className = 'w-2.5 h-2.5 rounded-full bg-zinc-600';
                statusText.innerText = 'Offline';
                statusText.className = 'text-xs font-mono font-medium text-zinc-400 uppercase tracking-wider';
                liveNotice.innerText = 'Disconnected';
                liveNotice.classList.remove('hidden');
                
                bpm = 0;
                heartEmoji.classList.remove('heart-beat');
                heartEmoji.classList.add('heart-idle');

                setTimeout(connectPulsoid, 5000);
            };
        }

        // Start heartbeat animation loop and WebSocket connection
        heartbeatLoop();
        connectPulsoid();
    </script>
</body>
